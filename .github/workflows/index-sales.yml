# Persists settled trades to data/history.json.
#
# The whole "database" for this project: a cron, a script, and a commit. Each
# run appends whatever settled since the height recorded in the file, so the
# history is a series of diffs anyone can audit against the chain.
#
# Not on the critical path. The Activity page reads recent trades live, so a
# fresh trade shows up immediately; this backfills the long tail.
#
# Safe to re-run and safe to run twice at once: trades merge by the box each one
# settled, and a box can only be spent once.

name: index sales

on:
  schedule:
    # Every 15 minutes. Not on the critical path — the Activity page reads
    # recent trades straight from the chain — but frequency still buys
    # something: the live window covers the last 30 transactions per contract,
    # so the tighter this runs, the more trades would have to land between runs
    # before any could fall between the two sources.
    #
    # Costs nothing. Public repositories get unlimited Actions minutes, a run
    # that finds nothing is four API calls, and the commit step is skipped
    # unless the trades actually changed.
    #
    # No point going lower: GitHub will not schedule a cron more often than
    # every five minutes, and warns that scheduled runs are delayed under load
    # and can be dropped outright.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: # so a fresh trade can be pulled in on demand

permissions:
  contents: write

concurrency:
  group: index-sales
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run index:sales

      - name: Commit if anything settled
        run: |
          # `updatedAt` changes on every run, so a plain `git diff --quiet` would
          # commit an empty update four times a day. Compare the trades instead.
          if git diff --quiet -- data/history.json; then
            echo "no change"
            exit 0
          fi
          before=$(git show HEAD:data/history.json | jq -c '.trades' 2>/dev/null || echo null)
          after=$(jq -c '.trades' data/history.json)
          if [ "$before" = "$after" ]; then
            echo "only the timestamp moved; skipping"
            git checkout -- data/history.json
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/history.json
          git commit -m "chore: index settled trades"
          git push
