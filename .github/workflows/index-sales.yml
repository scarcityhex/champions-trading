# Keeps data/history.json in step with the chain.
#
# The whole "database" for this project: a cron, a script, and a commit. Each
# run appends whatever settled since the height recorded in the file, so the
# history is a series of diffs anyone can audit against the chain.
#
# Safe to re-run and safe to run twice at once: trades merge by the box each one
# settled, and a box can only be spent once.

name: index sales

on:
  schedule:
    - cron: '17 */6 * * *' # four times a day, off the hour to dodge the rush
  workflow_dispatch: # so a fresh trade can be pulled in on demand

permissions:
  contents: write

concurrency:
  group: index-sales
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run index:sales

      - name: Commit if anything settled
        run: |
          # `updatedAt` changes on every run, so a plain `git diff --quiet` would
          # commit an empty update four times a day. Compare the trades instead.
          if git diff --quiet -- data/history.json; then
            echo "no change"
            exit 0
          fi
          before=$(git show HEAD:data/history.json | jq -c '.trades' 2>/dev/null || echo null)
          after=$(jq -c '.trades' data/history.json)
          if [ "$before" = "$after" ]; then
            echo "only the timestamp moved; skipping"
            git checkout -- data/history.json
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/history.json
          git commit -m "chore: index settled trades"
          git push
